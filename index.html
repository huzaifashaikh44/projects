<html>
    <head>
        <title>Feedback Form</title>
    </head>
    <style>
        h1{
            text-align: center;
        }
        .box{
            border: 1px solid black;
            display: inline-block;
            padding: 5px;
            width: 60%;
            background-color: rgb(207, 202, 202);
            text-align: center;
            border-radius: 3%;
        }
        #sel{
            width: 30%;
            
        }
        #tr{
            width: 38%;
            height: 28%;
        }
       
    </style>
    <body>
    <div class="box">
     <h1>Feedback Form</h1>
     <form>
    <label> Student Name </label>
    <input size="20" type="text"><br><br>

    <labelS> Student E-Mail </label>
    <input size="20" type="text"><br><br>
    
    <label id="l3"> How do you know this Institute </label>
    <select name="s1" id="sel">
        <option>Through college management</option>
        <option>Friends</option>
        <option>Alumina</option>
        <option>Social media</option>
    </select>
        <br><br>

    <label>How do you rate the faculty</label>
    
    <input type="radio"  name="Rating">Poor
    <input type="radio"  name="Rating">Good
    <input type="radio"  name="Rating">Very good
    <input type="radio"  name="Rating">Excellent

    <p>Suggestions for betterment of faculty and Institute</p>

    <textarea id="tr" placeholder="Type Suggestions"></textarea>
    <br>
    <br>
    <button>Send</button>
    <button>Clear</button>
</form>    
    </div>
    </body> 
</html>
